[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tic-tim-demografia"
version = "0.1.0.dev0"
description = "Pipeline reprodutível do diagnóstico demográfico, habitacional e urbano TIC–TIM"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16",
  "requests>=2.32",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "geopandas>=1.0",
  "pyogrio>=0.9",
  "shapely>=2.0",
  "libpysal>=4.12",
  "esda>=2.6",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
