name: TIC-TIM Franco da Rocha Entorno QA

on:
  workflow_dispatch:
  push:
    branches:
      - tic-tim-franco-da-rocha-apond-pipeline
    paths:
      - '.github/workflows/tic_tim_franco_da_rocha_entorno_qa.yml'

permissions:
  contents: write

jobs:
  entorno-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instala dependencias
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Materializa composição Setor-APOND auditada
        env:
          MAPPING_GZ_B64: 
        run: |
          mkdir -p data/tic_tim /tmp/franco_entorno/raw /tmp/franco_entorno/csv /tmp/franco_entorno/out
          python - <<'PY'
          import os,base64,gzip
          raw=gzip.decompress(base64.b64decode(os.environ['MAPPING_GZ_B64']))
          open('data/tic_tim/franco_da_rocha_setor_apond_368.csv','wb').write(raw)
          PY
          python - <<'PY'
          import pandas as pd
          p='data/tic_tim/franco_da_rocha_setor_apond_368.csv'
          d=pd.read_csv(p,dtype=str)
          assert len(d)==368 and d.CD_SETOR.nunique()==368
          expected={'3516408001':45,'3516408002':47,'3516408003':44,'3516408004':72,'3516408005':52,'3516408006':64,'3516408007':44}
          assert d.groupby('APOND').size().to_dict()==expected
          print('PASS mapping', expected)
          PY
      - name: Baixa agregados oficiais de Entorno
        run: |
          BASE='https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios_Caracteristicas_urbanisticas_do_entorno_dos_domicilios/Agregados_por_Setor_csv'
          curl --fail --location --retry 3 "$BASE/Agregados_por_setores_entorno_domic%C3%ADlios_BR.zip" -o /tmp/franco_entorno/raw/domicilios.zip
          curl --fail --location --retry 3 "$BASE/Agregados_por_setores_entorno_moradores_BR.zip" -o /tmp/franco_entorno/raw/moradores.zip
          curl --fail --location --retry 3 "$BASE/Agregados_por_setores_entorno_faces_BR.zip" -o /tmp/franco_entorno/raw/faces.zip
          for z in /tmp/franco_entorno/raw/*.zip; do unzip -j "$z" '*.csv' -d /tmp/franco_entorno/csv; done
      - name: Identifica séries
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          root=Path('/tmp/franco_entorno/csv'); achados={}
          for p in root.glob('*.csv'):
              h=pd.read_csv(p,sep=';',nrows=0,encoding='utf-8-sig'); cols=[str(c).upper() for c in h.columns]
              for pref in ('V050','V052','V054'):
                  if f'{pref}00' in cols and f'{pref}34' in cols: achados[pref]=str(p)
          assert set(achados)=={'V050','V052','V054'}, achados
          Path('/tmp/franco_entorno/paths.env').write_text('\n'.join(f'{k}={v}' for k,v in achados.items())+'\n')
          PY
      - name: Agrega contadores
        run: |
          . /tmp/franco_entorno/paths.env
          python scripts/tic_tim/agregar_entorno_apond_csv.py --domicilios "$V050" --moradores "$V052" --faces "$V054" --matriz data/tic_tim/franco_da_rocha_setor_apond_368.csv --saida /tmp/franco_entorno/out/franco_entorno_contadores.csv --qa /tmp/franco_entorno/out/franco_entorno_agregacao_qa.json --n-setores-esperados 368 --n-aponds-esperadas 7
      - name: Calcula 30 distribuições
        run: |
          python scripts/tic_tim/calcular_entorno_apond.py --contadores /tmp/franco_entorno/out/franco_entorno_contadores.csv --config config/tic_tim_entorno_regras.json --saida /tmp/franco_entorno/out/franco_entorno_30_distribuicoes.csv --qa /tmp/franco_entorno/out/franco_entorno_distribuicoes_qa.json --n-aponds-esperadas 7
      - name: Valida QA final
        run: |
          python - <<'PY'
          import json
          a=json.load(open('/tmp/franco_entorno/out/franco_entorno_agregacao_qa.json'))
          d=json.load(open('/tmp/franco_entorno/out/franco_entorno_distribuicoes_qa.json'))
          assert a['status']=='PASS' and a['n_setores_matriz']==368 and a['n_aponds']==7 and a['n_variaveis_entorno']==105
          assert d['status']=='PASS' and d['n_aponds']==7 and d['n_grupos_qa']==240
          print('PASS AGREGACAO',a)
          print('PASS DISTRIBUICOES',d)
          PY
      - name: Persiste resultados
        run: |
          mkdir -p data/tic_tim/franco_da_rocha_entorno
          cp /tmp/franco_entorno/out/* data/tic_tim/franco_da_rocha_entorno/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tic_tim/franco_da_rocha_setor_apond_368.csv data/tic_tim/franco_da_rocha_entorno
          if ! git diff --cached --quiet; then git commit -m 'Persist audited Franco da Rocha Entorno results'; git push; fi
      - name: Publica artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tic-tim-franco-da-rocha-entorno-qa
          path: /tmp/franco_entorno/out/**
          retention-days: 14
