name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pylint
        run: python -m pip install --upgrade pip pylint
      - name: Run Pylint error gate
        run: pylint --errors-only --disable=import-error,unexpected-keyword-arg $(git ls-files '*.py')
