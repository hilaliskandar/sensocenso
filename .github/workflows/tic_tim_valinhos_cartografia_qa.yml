name: TIC-TIM Valinhos Cartografia QA

on:
  workflow_dispatch:
  push:
    branches:
      - tic-tim-valinhos-apond-pipeline
    paths:
      - '.github/workflows/tic_tim_valinhos_cartografia_qa.yml'

permissions:
  contents: read

jobs:
  valinhos-cartografia:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instala dependências
        run: python -m pip install --disable-pip-version-check geopandas pyogrio shapely matplotlib pandas
      - name: Recupera builder parametrizado validado
        run: |
          curl --fail --location 'https://raw.githubusercontent.com/hilaliskandar/sensocenso/429595319687f12e9842bd1fba2db4398df992f0/scripts/tic_tim/build_cartografia_apond.py' -o /tmp/build_cartografia_apond.py
      - name: Baixa fontes oficiais IBGE
        run: |
          mkdir -p /tmp/apond_val/setores /tmp/apond_val/faces /tmp/apond_val/out
          curl --fail --location --retry 3 'https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios/malha_com_atributos/setores/shp/UF/SP/SP_setores_CD2022.zip' -o /tmp/apond_val/setores.zip
          curl --fail --location --retry 3 'https://geoftp.ibge.gov.br/recortes_para_fins_estatisticos/malha_de_setores_censitarios/censo_2022/base_de_faces_de_logradouros_versao_2022_censo_demografico/shp/SP_faces_de_logradouros_2022_shp.zip' -o /tmp/apond_val/faces.zip
          unzip -q /tmp/apond_val/setores.zip -d /tmp/apond_val/setores
          python - <<'PY'
          import zipfile
          z=zipfile.ZipFile('/tmp/apond_val/faces.zip')
          target=[n for n in z.namelist() if '3556206' in n]
          assert target, 'faces de Valinhos não localizadas'
          for n in target: z.extract(n,'/tmp/apond_val/faces')
          print('faces files', len(target))
          PY
      - name: Executa builder parametrizado em Valinhos
        run: |
          python /tmp/build_cartografia_apond.py \
            --config config/tic_tim/apond/valinhos_cartografia.json \
            --matriz data/tic_tim/valinhos_setor_apond_233.csv \
            --setores /tmp/apond_val/setores \
            --faces /tmp/apond_val/faces \
            --out-dir /tmp/apond_val/out
      - name: Confere invariantes de Valinhos
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('/tmp/apond_val/out/TIC_TIM_Censo2022_Valinhos_QA_CARTOGRAFIA_v1.json').read_text())
          assert q['status']=='PASS'
          assert q['n_setores']==233 and q['n_setores_unicos']==233
          assert q['n_aponds']==7
          assert q['setores_por_apond']=={'3556206001':30,'3556206002':24,'3556206003':29,'3556206004':27,'3556206005':56,'3556206006':32,'3556206007':35}
          assert q['setores_faltantes']==[] and q['setores_extras']==[]
          assert q['preflight_gpkg']['setores']['n']==233
          assert q['preflight_gpkg']['aponds']['n']==7
          assert q['preflight_gpkg']['faces']['n']>0
          print('VALINHOS_PASS',q)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tic-tim-apond-cartografia-parametrizada-valinhos
          path: /tmp/apond_val/out/**
          retention-days: 14
