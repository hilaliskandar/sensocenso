name: TIC-TIM Caieiras Entorno QA

on:
  workflow_dispatch:
  push:
    branches:
      - tic-tim-caieiras-apond-pipeline
    paths:
      - '.github/workflows/tic_tim_caieiras_entorno_qa.yml'
      - 'scripts/tic_tim/**'
      - 'config/tic_tim_entorno_regras.json'
      - 'data/tic_tim/caieiras_setor_apond_207.csv'

permissions:
  contents: read

jobs:
  entorno-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instala dependencias minimas
        run: python -m pip install --disable-pip-version-check pandas numpy dbfread

      - name: Valida insumo territorial
        run: |
          python - <<'PY'
          import pandas as pd
          p = 'data/tic_tim/caieiras_setor_apond_207.csv'
          d = pd.read_csv(p, dtype=str)
          assert list(d.columns) == ['CD_SETOR', 'APOND']
          assert len(d) == 207, len(d)
          assert d['CD_SETOR'].nunique() == 207
          assert set(d['APOND']) == {f'350900700{i}' for i in range(1, 8)}
          counts = d.groupby('APOND').size().to_dict()
          expected = {'3509007001':47,'3509007002':25,'3509007003':31,'3509007004':28,'3509007005':38,'3509007006':27,'3509007007':11}
          assert counts == expected, (counts, expected)
          print('PASS mapping 207 setores / 7 APONDs', counts)
          PY

      - name: Inspeciona pacotes oficiais republicados em 17-04-2025
        run: |
          mkdir -p /tmp/caieiras_entorno/raw /tmp/caieiras_entorno/out
          BASE='https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios/Agregados_por_Setor_csv'
          curl --fail --location --retry 3 "$BASE/Agregados_por_setores_caracteristicas_domicilio2_BR_20250417.zip" -o /tmp/caieiras_entorno/raw/domicilio2.zip
          curl --fail --location --retry 3 "$BASE/Agregados_por_setores_caracteristicas_domicilio3_BR_20250417.zip" -o /tmp/caieiras_entorno/raw/domicilio3.zip
          python - <<'PY'
          import csv, io, zipfile
          for p in ['/tmp/caieiras_entorno/raw/domicilio2.zip','/tmp/caieiras_entorno/raw/domicilio3.zip']:
              print('ZIP=', p)
              with zipfile.ZipFile(p) as z:
                  print('MEMBERS=', z.namelist())
                  for name in z.namelist():
                      if name.lower().endswith('.csv'):
                          with z.open(name) as f:
                              line = io.TextIOWrapper(f, encoding='utf-8-sig', errors='replace').readline().strip()
                          print('HEADER', name, '=', line[:5000])
          PY

      - name: Verifica se pacotes contêm séries do Entorno
        run: |
          python - <<'PY'
          import io, zipfile
          wanted = ('V05000','V05200','V05400','V05001','V05201','V05401')
          found = {}
          for p in ['/tmp/caieiras_entorno/raw/domicilio2.zip','/tmp/caieiras_entorno/raw/domicilio3.zip']:
              with zipfile.ZipFile(p) as z:
                  for name in z.namelist():
                      if not name.lower().endswith('.csv'):
                          continue
                      with z.open(name) as f:
                          header = io.TextIOWrapper(f, encoding='utf-8-sig', errors='replace').readline()
                      hits = [v for v in wanted if v.lower() in header.lower()]
                      if hits:
                          found[name] = hits
          print('ENTORNO_HITS=', found)
          if not found:
              raise SystemExit('PACOTES_DOMICILIO2_3_NAO_CONTEM_ENTORNO')
          PY

      - name: Publica diagnostico
        if: always()
        run: echo 'Diagnostico de fonte oficial concluido; nenhum resultado estatistico promovido nesta rodada.'
