name: TIC-TIM demografia live

# Execucao viva deliberadamente separada do CI offline. O push neste arquivo
# serve tambem para repetir o teste integral apos ajustes na camada de rede.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tic_tim_demografia_live.yml'

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: subprojetos/tic_tim_demografia_habitacao
    env:
      TIC_TIM_DATA_ROOT: /tmp/tic_tim_demografia_data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instala dependencias
        run: python -m pip install -e '.[dev]'
      - name: Executa testes offline
        run: pytest -q
      - name: Executa etapa 00
        run: python scripts/run_pipeline.py --etapa 00
      - name: Executa etapa 01
        run: python scripts/run_pipeline.py --etapa 01
      - name: Executa etapa 02a
        run: python scripts/run_pipeline.py --etapa 02a
      - name: Executa etapa 02b
        run: python scripts/run_pipeline.py --etapa 02b
      - name: Executa etapa 02c
        run: python scripts/run_pipeline.py --etapa 02c
      - name: Lista artefatos
        if: always()
        run: |
          find /tmp/tic_tim_demografia_data/outputs/qa -maxdepth 3 -type f -print || true
          find /tmp/tic_tim_demografia_data/processed/municipal -maxdepth 2 -type f -print || true
      - name: Publica QA e base municipal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tic-tim-demografia-live
          path: |
            /tmp/tic_tim_demografia_data/outputs/qa/**
            /tmp/tic_tim_demografia_data/metadata/**
            /tmp/tic_tim_demografia_data/processed/municipal/**
          if-no-files-found: warn
          retention-days: 14
